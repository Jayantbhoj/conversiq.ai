version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customer_support_rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
  image: qdrant/qdrant
  ports:
    - "6333:6333"
      
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/customer_support_rag
      PORT: 4000
      NODE_ENV: production
    ports:
      - '4000:4000'
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  postgres_data:
